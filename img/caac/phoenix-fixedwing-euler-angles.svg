<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f8fafc"/>
  <rect x="50" y="40" width="1100" height="680" rx="28" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>
  <text x="600" y="90" text-anchor="middle" font-size="34" font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#1f2937">固定翼姿态与欧拉角示意图</text>
  <text x="600" y="124" text-anchor="middle" font-size="18" font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#6b7280">固定翼操纵里最常用的 3 个姿态角：滚转 Roll(phi)、俯仰 Pitch(theta)、偏航 Yaw(psi)</text>

  <ellipse cx="600" cy="400" rx="72" ry="210" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/>
  <polygon points="600,170 565,235 635,235" fill="#0284c7"/>
  <rect x="390" y="355" width="420" height="42" rx="21" fill="#93c5fd" stroke="#2563eb" stroke-width="4"/>
  <polygon points="510,570 455,645 515,620" fill="#2563eb"/>
  <polygon points="690,570 745,645 685,620" fill="#2563eb"/>

  <line x1="600" y1="400" x2="970" y2="400" stroke="#ef4444" stroke-width="8"/>
  <polygon points="990,400 955,380 955,420" fill="#ef4444"/>
  <text x="1000" y="388" font-size="24" font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#ef4444">机体系 X 轴</text>
  <text x="1000" y="420" font-size="20" font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#b91c1c">指向机头前方</text>

  <line x1="600" y1="400" x2="320" y2="250" stroke="#22c55e" stroke-width="8"/>
  <polygon points="305,242 336,241 322,268" fill="#22c55e"/>
  <text x="170" y="238" font-size="24" font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#16a34a">机体系 Y 轴</text>
  <text x="160" y="270" font-size="20" font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#166534">指向右翼方向</text>

  <line x1="600" y1="400" x2="600" y2="660" stroke="#7c3aed" stroke-width="8"/>
  <polygon points="600,680 580,645 620,645" fill="#7c3aed"/>
  <text x="630" y="640" font-size="24" font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#7c3aed">机体系 Z 轴</text>
  <text x="630" y="672" font-size="20" font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#6d28d9">通常记为向下</text>

  <path d="M 770 300 A 120 120 0 0 1 770 500" fill="none" stroke="#f59e0b" stroke-width="8"/>
  <polygon points="775,506 748,487 780,478" fill="#f59e0b"/>
  <text x="840" y="410" font-size="26" font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#d97706">滚转 Roll (phi)</text>
  <text x="840" y="445" font-size="20" font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#92400e">绕机体系 X 轴转动</text>

  <path d="M 430 255 A 150 150 0 0 1 770 255" fill="none" stroke="#0ea5e9" stroke-width="8"/>
  <polygon points="780,255 748,241 754,273" fill="#0ea5e9"/>
  <text x="600" y="205" text-anchor="middle" font-size="26" font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#0284c7">俯仰 Pitch (theta)</text>
  <text x="600" y="237" text-anchor="middle" font-size="20" font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#0c4a6e">绕机体系 Y 轴转动</text>

  <path d="M 435 520 A 190 95 0 1 1 765 520" fill="none" stroke="#10b981" stroke-width="8"/>
  <polygon points="772,520 742,506 745,537" fill="#10b981"/>
  <text x="600" y="565" text-anchor="middle" font-size="26" font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#059669">偏航 Yaw (psi)</text>
  <text x="600" y="597" text-anchor="middle" font-size="20" font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#065f46">绕机体系 Z 轴转动</text>

  <rect x="120" y="585" width="350" height="88" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="145" y="620" font-size="22" font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#9a3412">记忆方法</text>
  <text x="145" y="654" font-size="19" font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#7c2d12">副翼对应滚转，升降对应俯仰，方向舵对应偏航。</text>

  <rect x="730" y="585" width="350" height="88" rx="16" fill="#eef6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="755" y="620" font-size="22" font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#1d4ed8">注意</text>
  <text x="755" y="654" font-size="19" font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#1e40af">油门不直接对应欧拉角，它主要影响速度、推力和总能量。</text>
</svg>
